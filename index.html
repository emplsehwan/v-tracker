<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>V-Tracker (Online Sync Edition)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050508; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    /* 동적 크로스헤어 */
    #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; transition: transform 0.05s ease-out; }
    .ch-dot { width: 6px; height: 6px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 5px rgba(0,255,204,0.8); }
    .firing { transform: translate(-50%, -50%) scale(1.8) !important; }

    #hit-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; pointer-events: none; z-index: 9; opacity: 0; transition: opacity 0.1s; }
    #hit-marker::before, #hit-marker::after { content: ''; position: absolute; top: 14px; left: 0; width: 30px; height: 2px; background: #fff; box-shadow: 0 0 8px #ff4655; }
    #hit-marker::before { transform: rotate(45deg); }
    #hit-marker::after { transform: rotate(-45deg); }

    /* 저격 스코프 */
    #sniper-scope { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,0,0,0) 15%, rgba(0,0,0,0.98) 50%); border: 2px solid #000; display: none; pointer-events: none; z-index: 8; }
    #sniper-scope::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(255,50,50,0.6); }
    #sniper-scope::after { content: ''; position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(255,50,50,0.6); }
    #scope-dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #ff4655; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 0 0 10px #ff4655; }

    /* 인게임 상단 HUD */
    #hud { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; color: #fff; font-size: 20px; font-weight: bold; background: rgba(10,10,15,0.85); padding: 10px 35px; border-radius: 12px; border: 1px solid #333; pointer-events: none; z-index: 5; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .hud-label { font-size: 11px; color: #ff4655; text-transform: uppercase; margin-bottom: 3px; text-align: center; letter-spacing: 1px; }

    /* 대시보드 오버레이 */
    #dashboard-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,8,0.9); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; gap: 30px; color: white; z-index: 20; padding: 20px; box-sizing: border-box; }
    
    .panel { background: rgba(20,20,28,0.95); padding: 30px; border-radius: 14px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); height: 580px; box-sizing: border-box; display: flex; flex-direction: column; }
    #setup-panel { width: 340px; }
    #rank-panel { width: 500px; }

    .panel h1 { font-size: 26px; color: #ff4655; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 1.5px; }
    .panel h2 { font-size: 13px; color: #888; margin: 0 0 15px 0; font-weight: normal; }

    .sync-badge { display: inline-block; font-size: 11px; padding: 4px 8px; border-radius: 4px; margin-bottom: 12px; font-weight: bold; }
    .sync-online { background: rgba(0, 255, 204, 0.15); color: #00ffcc; border: 1px solid #00ffcc; }
    .sync-local { background: rgba(255, 170, 0, 0.15); color: #ffaa00; border: 1px solid #ffaa00; }

    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: #ccc; }
    .setting-row input, .setting-row select { width: 150px; background: #121218; border: 1px solid #444; color: #00ffcc; text-align: center; border-radius: 6px; padding: 7px; font-size: 13px; outline: none; }
    .setting-row input:focus, .setting-row select:focus { border-color: #ff4655; }
    
    .btn { width: 100%; background: #ff4655; border: none; color: white; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; margin-top: 15px; }
    .btn:hover { background: #ff5f6d; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 70, 85, 0.4); }
    .btn-danger { background: #222; border: 1px solid #555; color: #bbb; padding: 8px; font-size: 12px; margin-top: auto; }
    .btn-danger:hover { background: #990000; color: #fff; border-color: #ff4655; transform: none; box-shadow: none; }

    /* 랭킹 테이블 스타일 */
    .table-container { flex: 1; overflow-y: auto; margin-bottom: 10px; border: 1px solid #222; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
    th { background: #181822; color: #ff4655; padding: 10px 5px; position: sticky; top: 0; font-size: 12px; border-bottom: 1px solid #333; }
    td { padding: 8px 5px; border-bottom: 1px solid #1a1a24; color: #ddd; }
    tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    tr:hover { background: rgba(0,255,204,0.05); }
    
    .rank-1 { color: #ffd700; font-weight: bold; }
    .rank-2 { color: #c0c0c0; font-weight: bold; }
    .rank-3 { color: #cd7f32; font-weight: bold; }
    .highlight-score { color: #00ffcc; font-weight: bold; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Firebase 실시간 연동 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="crosshair" class="ch-dot"></div>
  <div id="hit-marker"></div>
  <div id="sniper-scope"><div id="scope-dot"></div></div>

  <div id="hud">
    <div><div class="hud-label">Time</div><span id="timer">60</span>s</div>
    <div><div class="hud-label">Score</div><span id="score">0</span></div>
    <div><div class="hud-label">Hits</div><span id="hits-count">0</span></div>
    <div><div class="hud-label">Acc</div><span id="accuracy">100</span>%</div>
  </div>

  <div id="dashboard-overlay">
    <!-- 왼쪽: 참가자 등록 및 게임 설정 -->
    <div class="panel" id="setup-panel">
      <h1>V-TRACKER</h1>
      <h2 id="status-desc">참가자 정보를 입력하고 시작하세요.</h2>
      
      <div class="setting-row">
        <span>학번 (필수)</span>
        <input type="text" id="player-id" placeholder="예: 20101" maxlength="10">
      </div>
      <div class="setting-row">
        <span>이름 (필수)</span>
        <input type="text" id="player-name" placeholder="예: 홍길동" maxlength="10">
      </div>
      <div class="setting-row">
        <span>훈련 모드</span>
        <select id="mode-select">
          <option value="gridshot">Gridshot (플릭)</option>
          <option value="tracking">Tracking (봇 추적)</option>
        </select>
      </div>
      <div class="setting-row">
        <span>무기 선택</span>
        <select id="weapon-select">
          <option value="pistol">Ghost (단발)</option>
          <option value="vandal">Vandal (연사)</option>
          <option value="sniper">Operator (저격)</option>
        </select>
      </div>
      <div class="setting-row">
        <span>인게임 감도</span>
        <input type="number" id="sens" value="0.5" step="0.01" min="0.01">
      </div>
      <div class="setting-row">
        <span>줌 감도 배수</span>
        <input type="number" id="zoom-sens" value="1.0" step="0.01" min="0.01">
      </div>
      
      <button class="btn" id="start-game-btn">훈련 시작 (START)</button>
      <div style="font-size: 11px; color: #777; margin-top: 10px; line-height: 1.4; text-align: center;">
        게임 중 <b>ESC</b>를 누르면 일시정지 및 설정 변경이 가능합니다.
      </div>
    </div>

    <!-- 오른쪽: 실시간 명예의 전당 -->
    <div class="panel" id="rank-panel">
      <h1>🏆 실시간 통합 랭킹판</h1>
      <div id="sync-status" class="sync-badge sync-local">연결 확인 중...</div>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 12%;">순위</th>
              <th style="width: 22%;">학번</th>
              <th style="width: 22%;">이름</th>
              <th style="width: 24%;">점수 (명중수)</th>
              <th style="width: 20%;">명중률</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>

      <button class="btn btn-danger" id="reset-rank-btn">⚠️ 랭킹판 전체 초기화 (관리자 전용)</button>
    </div>
  </div>

  <script>
    // --- 올바르게 수정된 Firebase DB 실시간 연동 주소 ---
    const FIREBASE_DB_URL = "https://v-tracker-53f77-default-rtdb.firebaseio.com/";
    const ADMIN_PIN = "1234"; // 관리자 초기화 비밀번호

    let dbRef = null;
    const syncBadge = document.getElementById('sync-status');
    const STORAGE_KEY = 'vtracker_ranking_data';

    if (FIREBASE_DB_URL.startsWith("https://")) {
      try {
        firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
        dbRef = firebase.database().ref('rankings');
        syncBadge.className = 'sync-badge sync-online';
        syncBadge.innerText = '🟢 모든 PC 실시간 연동 중 (최고 득점자 문화상품권 증정)';

        dbRef.on('value', (snapshot) => {
          const data = snapshot.val();
          const list = data ? Object.values(data) : [];
          list.sort((a, b) => b.score - a.score || b.hits - a.hits);
          renderLeaderboard(list);
        });
      } catch (err) {
        console.error("Firebase 연결 오류:", err);
      }
    } else {
      syncBadge.className = 'sync-badge sync-local';
      syncBadge.innerText = '🟠 단독 PC 모드';
    }

    // --- 오디오 시스템 ---
    let audioCtx;
    function initAudio() {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    function playSound(type) {
      if(!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      if(type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      }
      osc.connect(gain); gain.connect(audioCtx.destination);
    }

    // --- 기본 상수 및 게임 변수 ---
    const VALORANT_YAW = 0.07 * (Math.PI / 180);
    const BASE_FOV = 70.53, ZOOM_FOV = 35;
    let valorantSensitivity = 0.5, zoomMultiplier = 1.0;
    let currentMode = 'gridshot', currentWeapon = 'pistol', isZoomed = false;
    let score = 0, shotsFired = 0, shotsHit = 0, timeLeft = 60, isPlaying = false, timerInterval;

    // --- 3D 씬 세팅 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.FogExp2(0x050508, 0.025);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth/window.innerHeight, 0.1, 1000);
    const player = new THREE.Group();
    player.position.set(0, 1.6, 10);
    player.add(camera);
    scene.add(player);

    // 총기 모델링
    const gunGroup = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({color: 0x222225, roughness: 0.6, metalness: 0.3});
    const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 0.6), bodyMat);
    gunBody.position.set(0, -0.05, -0.2);
    gunBody.castShadow = true;
    
    const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4, 16), new THREE.MeshStandardMaterial({color: 0x111, roughness: 0.8}));
    gunBarrel.rotation.x = Math.PI / 2;
    gunBarrel.position.set(0, -0.02, -0.6);
    gunBarrel.castShadow = true;

    const gunSight = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.03, 0.03), new THREE.MeshBasicMaterial({color: 0x00ffcc}));
    gunSight.position.set(0, 0.04, -0.3);

    gunGroup.add(gunBody, gunBarrel, gunSight);
    
    const flashLight = new THREE.PointLight(0xffcc66, 0, 5);
    flashLight.position.set(0, -0.02, -0.9);
    gunGroup.add(flashLight);
    
    gunGroup.position.set(0.3, -0.3, -0.4);
    camera.add(gunGroup);
    let gunRecoilAnim = 0;

    // 조명 및 맵
    scene.add(new THREE.AmbientLight(0x222233, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const mapGroup = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x101016, roughness: 0.9 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), wallMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    mapGroup.add(floor);
    
    const grid = new THREE.GridHelper(80, 80, 0x00ffcc, 0x333344);
    grid.position.y = 0.02;
    grid.material.opacity = 0.3;
    grid.material.transparent = true;
    mapGroup.add(grid);
    
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), wallMat);
    backWall.position.set(0, 15, -25);
    backWall.receiveShadow = true;
    mapGroup.add(backWall);
    scene.add(mapGroup);

    // 파티클
    const particles = [];
    const pMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const pGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);

    function spawnParticles(pos) {
      for(let i=0; i<15; i++) {
        const p = new THREE.Mesh(pGeo, pMat);
        p.position.copy(pos);
        p.velocity = new THREE.Vector3( (Math.random()-0.5)*15, (Math.random()-0.5)*15, (Math.random()-0.5)*15 );
        p.life = 1.0;
        scene.add(p);
        particles.push(p);
      }
    }

    function updateParticles(delta) {
      for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.position.addScaledVector(p.velocity, delta);
        p.velocity.y -= 20 * delta;
        p.life -= delta * 2;
        p.scale.setScalar(Math.max(0, p.life));
        if(p.life <= 0) {
          scene.remove(p);
          particles.splice(i, 1);
        }
      }
    }

    // 타겟 시스템
    const activeTargets = [];
    const targetMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x008888, emissiveIntensity: 0.8, roughness: 0.2 });
    const targetGeo = new THREE.SphereGeometry(0.6, 32, 32);

    function createTarget() {
      let target;
      if (currentMode === 'gridshot') {
        target = new THREE.Mesh(targetGeo, targetMat);
        target.position.set((Math.random()-0.5)*24, 2 + Math.random()*6, -20);
      } else {
        target = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16), targetMat);
        body.castShadow = true;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), targetMat);
        head.position.y = 0.85; head.castShadow = true;
        target.add(body, head);
        target.position.set(0, 0.6, -15);
        target.userData = { speedX: (Math.random() > 0.5 ? 1 : -1) * (6 + Math.random()*4) };
      }
      target.castShadow = true;
      scene.add(target);
      activeTargets.push(target);
    }

    function initTargets() {
      activeTargets.forEach(t => scene.remove(t));
      activeTargets.length = 0;
      const count = currentMode === 'gridshot' ? 3 : 1;
      for(let i=0; i<count; i++) createTarget();
    }

    // 사격 및 격발
    let isFiring = false;
    let lastFireTime = 0;
    
    function fireWeapon() {
      if(!isPlaying) return;
      const now = performance.now();
      if (currentWeapon === 'vandal' && now - lastFireTime < 100) return;
      if (currentWeapon !== 'vandal' && now - lastFireTime < 50) return;
      
      lastFireTime = now;
      shotsFired++;
      playSound('shoot');

      const ch = document.getElementById('crosshair');
      ch.classList.add('firing');
      setTimeout(() => ch.classList.remove('firing'), 50);
      
      gunRecoilAnim = currentWeapon === 'sniper' ? 0.5 : 0.2;
      gunGroup.position.z = -0.2;
      flashLight.intensity = 3.0;

      if (currentWeapon === 'vandal') {
        camera.rotation.x += 0.006; 
        player.rotation.y += (Math.random() - 0.5) * 0.003;
      }

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(activeTargets, true);

      if (hits.length > 0) {
        shotsHit++;
        score += (currentWeapon === 'sniper' ? 150 : 100);
        document.getElementById('score').innerText = score;
        document.getElementById('hits-count').innerText = shotsHit;
        
        playSound('hit');
        
        const hm = document.getElementById('hit-marker');
        hm.style.opacity = '1';
        setTimeout(() => hm.style.opacity = '0', 100);

        let hitRoot = hits[0].object;
        if (hitRoot.parent && hitRoot.parent.type === 'Group') hitRoot = hitRoot.parent;
        
        spawnParticles(hitRoot.position);

        const idx = activeTargets.indexOf(hitRoot);
        if (idx > -1) {
          scene.remove(hitRoot);
          activeTargets.splice(idx, 1);
          createTarget();
        }
      }
      document.getElementById('accuracy').innerText = Math.round((shotsHit/shotsFired)*100);
    }

    // 마우스 입력
    document.addEventListener('mousedown', (e) => {
      if(document.pointerLockElement !== document.body || !isPlaying) return;
      if (e.button === 2 && currentWeapon === 'sniper') {
        isZoomed = !isZoomed;
        camera.fov = isZoomed ? ZOOM_FOV : BASE_FOV;
        document.getElementById('sniper-scope').style.display = isZoomed ? 'block' : 'none';
        document.getElementById('crosshair').style.display = isZoomed ? 'none' : 'block';
        gunGroup.visible = !isZoomed;
        camera.updateProjectionMatrix();
      }
      if (e.button === 0) {
        isFiring = true;
        if(currentWeapon !== 'vandal') fireWeapon(); 
      }
    });

    document.addEventListener('mouseup', (e) => { if (e.button === 0) isFiring = false; });
    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== document.body) return;
      const zoomFactor = isZoomed ? (ZOOM_FOV/BASE_FOV) * zoomMultiplier : 1;
      player.rotation.y -= e.movementX * valorantSensitivity * zoomFactor * VALORANT_YAW;
      let pitch = camera.rotation.x - e.movementY * valorantSensitivity * zoomFactor * VALORANT_YAW;
      camera.rotation.x = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));
    });

    // --- 랭킹 저장 및 렌더링 시스템 ---
    function getLocalRankings() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveRanking(entry) {
      if (dbRef) {
        dbRef.push(entry);
      } else {
        const list = getLocalRankings();
        list.push(entry);
        list.sort((a, b) => b.score - a.score || b.hits - a.hits);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        renderLeaderboard(list);
      }
    }

    function renderLeaderboard(list) {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="color: #666; padding: 25px;">등록된 랭킹 기록이 없습니다.</td></tr>';
        return;
      }

      list.forEach((item, index) => {
        const row = document.createElement('tr');
        let rankClass = '';
        let rankLabel = index + 1;
        if (index === 0) { rankClass = 'rank-1'; rankLabel = '🥇 1위'; }
        else if (index === 1) { rankClass = 'rank-2'; rankLabel = '🥈 2위'; }
        else if (index === 2) { rankClass = 'rank-3'; rankLabel = '🥉 3위'; }

        row.innerHTML = `
          <td class="${rankClass}">${rankLabel}</td>
          <td>${item.id}</td>
          <td><b>${item.name}</b></td>
          <td class="highlight-score">${item.score}점 (${item.hits}개)</td>
          <td>${item.accuracy}%</td>
        `;
        tbody.appendChild(row);
      });
    }

    // 랭킹 리셋 방지 시스템
    document.getElementById('reset-rank-btn').addEventListener('click', () => {
      const pin = prompt("관리자 전용 기능입니다.\n랭킹판을 초기화하려면 관리자 비밀번호를 입력하세요:");
      if (pin === null) return;
      if (pin !== ADMIN_PIN) {
        alert("비밀번호가 일치하지 않습니다!");
        return;
      }

      const finalConfirm = confirm("⚠️ 경고!\n정말 모든 PC의 랭킹 기록을 초기화하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.");
      if (finalConfirm) {
        if (dbRef) {
          dbRef.remove();
        } else {
          localStorage.removeItem(STORAGE_KEY);
          renderLeaderboard([]);
        }
        alert("랭킹판이 성공적으로 초기화되었습니다.");
      }
    });

    // --- 게임 제어 및 대시보드 UI ---
    const overlay = document.getElementById('dashboard-overlay');
    const startBtn = document.getElementById('start-game-btn');
    const studentIdInput = document.getElementById('player-id');
    const playerNameInput = document.getElementById('player-name');

    startBtn.addEventListener('click', () => {
      const sId = studentIdInput.value.trim();
      const sName = playerNameInput.value.trim();

      if (!sId || !sName) {
        alert("학번과 이름을 반드시 입력해야 게임에 참여할 수 있습니다!");
        return;
      }

      initAudio();
      document.body.requestPointerLock();
    });

    document.getElementById('mode-select').addEventListener('change', e => { currentMode = e.target.value; initTargets(); });
    document.getElementById('weapon-select').addEventListener('change', e => {
      currentWeapon = e.target.value;
      if (currentWeapon !== 'sniper' && isZoomed) {
        isZoomed = false; camera.fov = BASE_FOV;
        document.getElementById('sniper-scope').style.display = 'none';
        document.getElementById('crosshair').style.display = 'block';
        gunGroup.visible = true; camera.updateProjectionMatrix();
      }
    });
    document.getElementById('sens').addEventListener('input', e => valorantSensitivity = parseFloat(e.target.value) || 0.5);
    document.getElementById('zoom-sens').addEventListener('input', e => zoomMultiplier = parseFloat(e.target.value) || 1.0);

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === document.body) {
        overlay.style.display = 'none';
        if (!isPlaying) startGame();
      } else {
        overlay.style.display = 'flex';
        document.getElementById('status-desc').innerText = "게임 일시정지 (설정 변경 가능)";
        startBtn.innerText = "게임 재개 (RESUME)";
        isPlaying = false;
        clearInterval(timerInterval);
        isFiring = false;
      }
    });

    function startGame() {
      isPlaying = true;
      if (activeTargets.length === 0) initTargets();
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function resetGameStats() {
      score = 0; shotsFired = 0; shotsHit = 0; timeLeft = 60;
      document.getElementById('score').innerText = 0;
      document.getElementById('hits-count').innerText = 0;
      document.getElementById('timer').innerText = 60;
      document.getElementById('accuracy').innerText = 100;
      
      isZoomed = false; camera.fov = BASE_FOV; camera.updateProjectionMatrix();
      document.getElementById('sniper-scope').style.display = 'none';
      document.getElementById('crosshair').style.display = 'block';
      gunGroup.visible = true;
      camera.rotation.x = 0; player.rotation.y = 0;
      initTargets();
    }

    function endGame() {
      document.exitPointerLock();
      isPlaying = false;
      clearInterval(timerInterval);

      const sId = studentIdInput.value.trim();
      const sName = playerNameInput.value.trim();
      const finalAcc = shotsFired > 0 ? Math.round((shotsHit / shotsFired) * 100) : 0;

      saveRanking({
        id: sId,
        name: sName,
        hits: shotsHit,
        score: score,
        accuracy: finalAcc,
        timestamp: Date.now()
      });

      alert(`🎉 훈련 종료!\n참가자: [${sId}] ${sName}\n맞춘 개수: ${shotsHit}개\n최종 점수: ${score}점\n명중률: ${finalAcc}%\n\n전체 통합 랭킹판에 실시간 등록되었습니다!`);
      
      resetGameStats();
      document.getElementById('status-desc').innerText = "참가자 정보를 새로 입력하고 시작하세요.";
      startBtn.innerText = "훈련 시작 (START)";
      studentIdInput.value = '';
      playerNameInput.value = '';
      studentIdInput.focus();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 애니메이션 루프 ---
    let prevTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = (time - prevTime) / 1000;

      if (isPlaying && isFiring && currentWeapon === 'vandal') fireWeapon();

      if (isPlaying && currentMode === 'tracking') {
        activeTargets.forEach(t => {
          t.position.x += t.userData.speedX * delta;
          if(t.position.x > 20 || t.position.x < -20) {
            t.userData.speedX *= -1;
            t.position.x = Math.max(-20, Math.min(20, t.position.x));
          }
        });
      }

      updateParticles(delta);

      if(gunRecoilAnim > 0) {
        gunRecoilAnim -= 3 * delta;
        gunGroup.rotation.x = Math.max(0, gunRecoilAnim);
        gunGroup.position.z += (-0.4 - gunGroup.position.z) * 10 * delta;
      } else {
        gunGroup.position.z = -0.4;
      }
      flashLight.intensity = Math.max(0, flashLight.intensity - 15 * delta);

      renderer.render(scene, camera);
      prevTime = time;
    }
    
    if (!dbRef) renderLeaderboard(getLocalRankings());
    animate();
  </script>
</body>
</html>
